<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Matrix multiplication runtime by execution model</title>
  <desc id="desc">Horizontal bar chart on a logarithmic seconds axis. Sequential 244.12 seconds, OpenMP 30.83 seconds, MPI 92.98 seconds, CUDA 0.165 seconds.</desc>
  <rect width="1400" height="760" rx="22" fill="#101820"/>
  <text x="76" y="82" fill="#f4f7fa" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">ONE WORKLOAD. FOUR COMPUTING MODELS.</text>
  <text x="78" y="124" fill="#9db0be" font-family="Segoe UI, Arial, sans-serif" font-size="18">4,000 × 4,000 matrix multiplication · elapsed time in seconds · logarithmic scale</text>
  <rect x="70" y="166" width="1260" height="526" rx="16" fill="#182832"/>
  <g stroke="#314450" stroke-width="1">
    <line x1="390" y1="218" x2="390" y2="610"/><line x1="600" y1="218" x2="600" y2="610"/>
    <line x1="810" y1="218" x2="810" y2="610"/><line x1="1020" y1="218" x2="1020" y2="610"/>
    <line x1="1230" y1="218" x2="1230" y2="610"/>
  </g>
  <g fill="#aebfc9" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="390" y="640">0.1 s</text><text x="600" y="640">1 s</text><text x="810" y="640">10 s</text><text x="1020" y="640">100 s</text><text x="1230" y="640">1,000 s</text>
  </g>
  <g fill="#edf3f6" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">
    <text x="108" y="273">Sequential</text><text x="108" y="371">OpenMP</text><text x="108" y="469">MPI</text><text x="108" y="567">CUDA</text>
  </g>
  <g opacity=".15"><rect x="108" y="288" width="11" height="4" fill="#ff746c"/></g>
  <rect x="390" y="244" width="704" height="42" rx="8" fill="#ff746c"/>
  <rect x="390" y="342" width="512" height="42" rx="8" fill="#54d6a0"/>
  <rect x="390" y="440" width="616" height="42" rx="8" fill="#f4c95d"/>
  <rect x="390" y="538" width="79" height="42" rx="8" fill="#58b4f8"/>
  <g fill="#f4f7fa" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
    <text x="1110" y="273">244.12 s</text><text x="918" y="371">30.83 s</text><text x="1022" y="469">92.98 s</text><text x="485" y="567">0.165 s</text>
  </g>
  <text x="78" y="674" fill="#91a5b3" font-family="Segoe UI, Arial, sans-serif" font-size="14">CUDA value is the reported end-to-end GPU phase. Measurements come from one reference dataset; hardware conditions may differ.</text>
</svg>
